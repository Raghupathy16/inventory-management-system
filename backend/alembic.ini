[alembic]
script_location = alembic
prepend_sys_path = .

# We deliberately do NOT hardcode sqlalchemy.url here — it's supplied at
# runtime by alembic/env.py, which builds it from our Settings object
# (same .env-driven config the app itself uses). This guarantees
# migrations always target the same database the app connects to; a
# hardcoded URL here could silently drift out of sync with the real config.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
